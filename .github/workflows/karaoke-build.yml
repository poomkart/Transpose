name: Karaoke Mode Build

on:
  push:
    branches:
      - feature/karaoke-mode
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/karaoke-mode

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.12.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Apply Karaoke Mode patch
        run: python3 tools/apply_karaoke_patch.py .

      - name: Disable private Firebase build plugins for fork debug build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('    alias(libs.plugins.google.services)\n', '')
          s = s.replace('    alias(libs.plugins.firebase.crashlytics)\n', '')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Commit generated integration changes
        run: |
          git checkout -- app/build.gradle.kts
          if git diff --quiet; then
            echo "No generated integration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feature/main/src/main/java/com/example/main/MainViewModel.kt
          git add feature/main/src/main/java/com/example/main/components/bottomsheet/PlayerBottomSheet.kt
          git add feature/main/src/main/java/com/example/main/components/karaoke/KaraokeLyrics.kt
          git commit -m "feat: integrate Karaoke Mode V1"
          git push origin HEAD:feature/karaoke-mode

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transpose-karaoke-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
